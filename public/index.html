<script src="/shim.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: menu lateral (administradores > páginas) + área de trabalho (visão geral, página de trabalho por etapa, detalhe do fundo, pendências, equipe) */
:root {
  --bg: #f4f6f4; --surface: #ffffff; --surface-2: #f7f8f7; --ink: #1a2422; --muted: #5a6763; --line: #e1e5e1; --line-2: #edf0ed;
  --accent: #1d5c54; --accent-ink: #ffffff; --accent-soft: #e3efec;
  --late: #a8221a; --late-bg: #fdecea; --warn: #8f4c05; --warn-bg: #fdf1e1; --ok: #22663e; --ok-bg: #e5f2ea;
  --info: #245a92; --info-bg: #e4edf7; --idle: #4f5b58; --idle-bg: #eceeed;
  --cat1: #2f6fb0; --cat2: #c2410c; --cat3: #7c3aed; --cat4: #0f8a7e; --cat5: #a07c05; --cat6: #a3477a;
  --st-inbox: #b8690a; --st-prep: #2f6fb0; --st-aud: #0f7d71; --st-df: #6b4fc4; --st-done: #2b7a4b;
  --font: "IBM Plex Sans", "Segoe UI", Arial, sans-serif; --mono: "IBM Plex Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101614; --surface: #171f1d; --surface-2: #1c2523; --ink: #e3eae7; --muted: #9aa8a4; --line: #2a3532; --line-2: #222c2a;
  --accent: #5fb3a6; --accent-ink: #0b1312; --accent-soft: #1d3632;
  --late: #f2867b; --late-bg: #3a1714; --warn: #eaa955; --warn-bg: #34240e; --ok: #6cc690; --ok-bg: #132a1d;
  --info: #7fb2ea; --info-bg: #182a3d; --idle: #a3afab; --idle-bg: #232c2a;
  --cat1: #6aa6e6; --cat2: #f08a4b; --cat3: #a98bf5; --cat4: #4cc3b5; --cat5: #e0c04f; --cat6: #e086b6;
  --st-inbox: #e8a44a; --st-prep: #6aa6e6; --st-aud: #4cc3b5; --st-df: #a98bf5; --st-done: #6cc690;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #101614; --surface: #171f1d; --surface-2: #1c2523; --ink: #e3eae7; --muted: #9aa8a4; --line: #2a3532; --line-2: #222c2a;
  --accent: #5fb3a6; --accent-ink: #0b1312; --accent-soft: #1d3632;
  --late: #f2867b; --late-bg: #3a1714; --warn: #eaa955; --warn-bg: #34240e; --ok: #6cc690; --ok-bg: #132a1d;
  --info: #7fb2ea; --info-bg: #182a3d; --idle: #a3afab; --idle-bg: #232c2a;
  --cat1: #6aa6e6; --cat2: #f08a4b; --cat3: #a98bf5; --cat4: #4cc3b5; --cat5: #e0c04f; --cat6: #e086b6;
  --st-inbox: #e8a44a; --st-prep: #6aa6e6; --st-aud: #4cc3b5; --st-df: #a98bf5; --st-done: #6cc690;
  color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font); }
a { color: var(--accent); text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.app { display: flex; flex-wrap: wrap; min-height: 100vh; }
/* Menu */
.nav { flex: 1 1 230px; max-width: 270px; background: var(--surface); border-right: 1px solid var(--line); padding: 18px 12px 24px; display: flex; flex-direction: column; gap: 18px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.brand .logo { width: 32px; height: 32px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.brand b { display: block; font-size: 14px; } .brand span { font-size: 12px; color: var(--muted); }
.nav-sec { display: flex; flex-direction: column; gap: 2px; }
.nav-label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 0 10px 6px; }
.nl { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 10px; border-radius: 6px; color: var(--ink); font-size: 13.5px; background: none; border: none; width: 100%; text-align: left; }
.nl:hover { background: var(--accent-soft); }
.nl.on { background: var(--accent); color: var(--accent-ink); }
.nl .n { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.nl.on .n { color: var(--accent-ink); opacity: .85; }
.nl.adm { font-weight: 600; }
.nl.sub { padding-left: 24px; font-size: 13px; }
.nl.adm span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Conteúdo */
.main { flex: 999 1 600px; min-width: 0; display: flex; flex-direction: column; }
.top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 12px 28px; border-bottom: 1px solid var(--line); background: var(--surface);
  padding-right: max(28px, env(safe-area-inset-right, 0px)); }
.crumbs { font-size: 13px; color: var(--muted); }
.crumbs b { color: var(--ink); font-weight: 600; }
.top-right { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.search { padding: 7px 12px; border: 1px solid var(--line); border-radius: 6px; width: 240px; max-width: 100%; background: var(--surface-2); }
.content { padding: 22px 28px 48px; display: flex; flex-direction: column; gap: 18px; padding-right: max(28px, env(safe-area-inset-right, 0px)); }
h1 { margin: 0; font-size: 23px; font-weight: 700; letter-spacing: -.01em; }
h2 { margin: 0; font-size: 15px; font-weight: 700; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.sub-t { color: var(--muted); margin: 2px 0 0; max-width: 72ch; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.pad { padding: 14px 16px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.between { justify-content: space-between; }
.btn { padding: 7px 13px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-size: 13px; }
.btn:hover { border-color: var(--accent); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.ghost { border-color: transparent; background: none; color: var(--accent); font-weight: 600; padding-left: 4px; padding-right: 4px; }
.btn:disabled { opacity: .5; cursor: default; }
.chip { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--idle-bg); color: var(--idle); }
.chip.late { background: var(--late-bg); color: var(--late); } .chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.ok { background: var(--ok-bg); color: var(--ok); } .chip.info { background: var(--info-bg); color: var(--info); }
.chip.ev { background: var(--surface-2); color: var(--ink); border-left: 4px solid var(--c); border-radius: 4px; white-space: normal; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi { padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; text-align: left; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.kpi b { font: 500 28px/1.1 var(--mono); }
.kpi span { font-size: 13px; color: var(--muted); }
.kpi.late b { color: var(--late); } .kpi.warn b { color: var(--warn); }
.alert { background: var(--warn-bg); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); border-radius: 10px; padding: 12px 16px; color: var(--warn); }
.alert strong { display: block; }
.adms { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 14px; }
.adm-card { display: flex; flex-direction: column; gap: 10px; }
.adm-row { display: grid; grid-template-columns: minmax(0,1fr) auto 86px; gap: 10px; align-items: center; padding: 7px 2px; border-top: 1px solid var(--line-2); background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; text-align: left; }
.adm-row:hover { background: var(--surface-2); }
.split2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; }
.bar-row { display: grid; grid-template-columns: 150px minmax(0,1fr) 72px; gap: 10px; align-items: center; font-size: 13px; padding: 4px 0; }
.bar { display: flex; height: 10px; border-radius: 3px; overflow: hidden; background: var(--line-2); }
.bar span { height: 100%; }
.av { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; font-size: 10.5px; font-weight: 600; color: #fff; border: 2px solid var(--surface); flex: none; overflow: hidden; background: var(--idle); }
.av img { width: 100%; height: 100%; object-fit: cover; }
.avs { display: inline-flex; } .avs .av + .av { margin-left: -6px; }
.person { display: inline-flex; align-items: center; gap: 7px; }
/* Página de trabalho */
.ptabs { display: flex; flex-wrap: wrap; gap: 20px; border-bottom: 1px solid var(--line); }
.ptab { padding: 9px 2px; border: none; border-bottom: 2px solid transparent; background: none; color: var(--muted); display: flex; gap: 6px; align-items: center; font-size: 13.5px; }
.ptab.on { border-bottom-color: var(--accent); color: var(--ink); font-weight: 600; }
.ptab .n { font-family: var(--mono); font-size: 11.5px; background: var(--idle-bg); color: var(--idle); border-radius: 999px; padding: 1px 7px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filters select, .filters input, .field input, .field select, .field textarea { padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-size: 13px; min-width: 0; }
.group { overflow: hidden; }
.g-head { width: 100%; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; padding: 11px 16px; border: none; background: var(--surface); text-align: left; }
.g-head .t { display: flex; align-items: center; gap: 10px; }
.g-dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.g-head b { font-size: 15px; }
.tbl { overflow-x: auto; border-top: 1px solid var(--line); }
.grid-row { display: grid; align-items: center; min-width: var(--minw, 980px); border-bottom: 1px solid var(--line-2); }
.grid-row > * { padding: 8px 12px; min-width: 0; }
.grid-head { background: var(--surface-2); }
.grid-head > * { font-size: 11.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); white-space: nowrap; }
.grid-row.item { cursor: pointer; }
.grid-row.item:hover { background: var(--surface-2); }
.f-name { font-weight: 600; overflow-wrap: anywhere; }
.f-sub { font-size: 11.5px; color: var(--muted); font-family: var(--mono); }
.grid-row.item > span:first-child { cursor: pointer; }
.mini { display: inline-block; width: 52px; height: 6px; border-radius: 3px; background: var(--line-2); overflow: hidden; vertical-align: middle; margin-right: 6px; }
.mini span { display: block; height: 100%; background: var(--accent); }
.empty { padding: 14px 16px; color: var(--muted); font-size: 13px; }
/* Etiquetas coloridas (tipo, exercício, auditor) */
.pill { display: inline-block; max-width: 100%; padding: 3px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; line-height: 1.35; color: #fff; background: var(--pc, var(--idle)); text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill.vazio { background: var(--idle-bg); color: var(--muted); font-weight: 500; }
/* Subitens */
.chev { width: 26px; height: 26px; flex: none; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); display: inline-grid; place-items: center; font-size: 11px; color: var(--muted); transition: transform .12s; }
.chev.on { transform: rotate(90deg); color: var(--accent); border-color: var(--accent); }
.f-cell { display: flex; gap: 10px; align-items: flex-start; }
.subn { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 12.5px; }
.subwrap { background: var(--surface-2); border-bottom: 1px solid var(--line); padding: 10px 14px 12px 30px; }
.subbox { border-left: 3px solid var(--accent); background: var(--surface); border-radius: 0 8px 8px 0; overflow-x: auto; }
.sub-row { display: grid; grid-template-columns: minmax(180px, 2fr) 140px 128px 140px 110px minmax(120px, 1.4fr) 112px; align-items: center; min-width: 930px; border-bottom: 1px solid var(--line-2); }
.sub-row > * { padding: 6px 8px; min-width: 0; }
.sub-row.grid-head > * { font-size: 11px; padding-top: 7px; padding-bottom: 7px; }
.sub-row select, .sub-row input { width: 100%; padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-size: 12.5px; }
.sub-row select[data-st] { font-weight: 600; border-left: 4px solid var(--sc, var(--line)); }
.sub-row.done { opacity: .72; }
.sub-add { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px; align-items: center; }
.sub-add input { flex: 1 1 260px; padding: 6px 9px; border: 1px dashed var(--line); border-radius: 6px; background: var(--surface); font-size: 13px; }
.sub-foot { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 6px 8px; font-size: 12.5px; }
.btn.sm { padding: 5px 9px; font-size: 12px; white-space: nowrap; }
.btn.okb { border-color: var(--ok); color: var(--ok); font-weight: 600; }
.btn.okb:hover { background: var(--ok); color: #fff; }
/* Controles internos */
.ctl-tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.ctl-tabs button { padding: 7px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 13px; }
.ctl-tabs button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.ctl-cli, .ctl-art { border-bottom: 1px solid var(--line-2); }
.ctl-cli > summary, .ctl-art > summary { list-style: none; cursor: pointer; padding: 11px 16px; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.ctl-cli > summary::-webkit-details-marker, .ctl-art > summary::-webkit-details-marker { display: none; }
.ctl-cli > summary::before, .ctl-art > summary::before { content: "▶"; font-size: 10px; color: var(--muted); transition: transform .12s; }
.ctl-cli[open] > summary::before, .ctl-art[open] > summary::before { transform: rotate(90deg); color: var(--accent); }
.ctl-cli > summary b, .ctl-art > summary b { font-size: 14px; }
.ctl-body { padding: 4px 16px 16px 34px; display: flex; flex-direction: column; gap: 12px; }
.ctl-attrs { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px 12px; }
.ctl-attrs label { display: flex; flex-direction: column; gap: 3px; font-size: 11.5px; font-weight: 600; color: var(--muted); }
.stsel { width: 100%; padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px; font-size: 12.5px; font-weight: 600; background: var(--surface); color: var(--ink); }
.ctl-mat { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
.ctl-mat table { border-collapse: collapse; width: 100%; min-width: 760px; font-size: 12.5px; }
.ctl-mat th, .ctl-mat td { border-bottom: 1px solid var(--line-2); padding: 5px 6px; text-align: left; white-space: nowrap; }
.ctl-mat th { background: var(--surface-2); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.ctl-mat td:first-child { white-space: normal; min-width: 200px; font-weight: 500; }
.ctl-mat .stsel { min-width: 104px; font-size: 11.5px; padding: 4px 5px; }
.ctl-txt { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13.5px; line-height: 1.55; }
.ctl-sub { border-left: 3px solid var(--line); padding: 2px 0 2px 12px; }
.ctl-sub h4 { margin: 0 0 4px; font-size: 13px; }
.ctl-nota { font-size: 12.5px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; background: var(--surface-2); border-radius: 6px; padding: 6px 9px; }
.ctl-chips { display: flex; flex-wrap: wrap; gap: 4px; }
.ctl-chip { font-size: 11px; padding: 1px 7px; border-radius: 4px; font-weight: 600; }
.ctl-form { display: flex; flex-direction: column; gap: 8px; }
.ctl-form input, .ctl-form textarea { padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-size: 13px; width: 100%; }
.ctl-form textarea { min-height: 220px; font-family: var(--font); line-height: 1.5; }
.ctl-grid-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.ctl-grid { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 1180px; font-size: 12.5px; }
.ctl-grid th { position: sticky; top: 0; background: var(--surface-2); color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; padding: 9px 6px; text-align: center; border-bottom: 1px solid var(--line); line-height: 1.25; }
.ctl-grid th:first-child, .ctl-grid td:first-child { position: sticky; left: 0; z-index: 1; text-align: left; background: var(--surface); min-width: 170px; padding-left: 14px; }
.ctl-grid th:first-child { background: var(--surface-2); z-index: 2; }
.ctl-grid td { padding: 4px 3px; border-bottom: 1px solid var(--line-2); text-align: center; }
.ctl-grid tr:hover td { background: var(--surface-2); }
.ctl-grid td.nome b { font-size: 13.5px; }
.stcell { width: 100%; min-width: 92px; border: 0; border-radius: 4px; padding: 8px 4px; font: 600 12px var(--font); text-align: center; text-align-last: center; appearance: none; -webkit-appearance: none; cursor: pointer; background: var(--surface-2); color: var(--muted); }
.stcell:disabled { cursor: default; opacity: 1; }
.stcell:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
.ctl-obsrow td { text-align: left; background: var(--surface-2); padding: 10px 14px 12px; }
.ctl-cols { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.ctl-col { padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.ctl-col small { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
/* Controles: tabelas de referência */
.ctl-secs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); }
.ctl-secs button { padding: 8px 12px; border: none; border-bottom: 2px solid transparent; background: none; color: var(--muted); font-size: 13.5px; display: inline-flex; gap: 6px; align-items: center; }
.ctl-secs button.on { border-bottom-color: var(--accent); color: var(--ink); font-weight: 600; }
.ctl-secs .n { font-family: var(--mono); font-size: 11.5px; background: var(--idle-bg); color: var(--idle); border-radius: 999px; padding: 1px 7px; }
.ref { width: 100%; border-collapse: collapse; font-size: 13px; }
.ref th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); background: var(--surface-2); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.ref td { padding: 9px 10px; border-bottom: 1px solid var(--line-2); vertical-align: top; overflow-wrap: anywhere; }
.ref td.c-titulo { font-weight: 600; min-width: 120px; }
.ref td { min-width: 90px; }
.ref tr:hover td { background: var(--surface-2); }
.ref td input, .ref td textarea { width: 100%; padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-size: 12.5px; font-family: inherit; }
.ref-wrap { overflow-x: auto; }
.mail { display: inline-flex; align-items: center; gap: 2px; margin: 1px 6px 1px 0; white-space: nowrap; }
.mail a { color: var(--accent); }
.cp { border: none; background: none; color: var(--muted); padding: 0 3px; font-size: 12px; cursor: pointer; }
.cp:hover { color: var(--accent); }
.path { font-family: var(--mono); font-size: 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; display: inline-block; overflow-wrap: anywhere; }
.lnk { display: inline-flex; gap: 6px; align-items: center; }
.lnk small { color: var(--muted); font-family: var(--mono); font-size: 11px; }
.ctl-aviso { padding: 10px 14px; border-radius: 8px; background: var(--warn-bg); color: var(--warn); font-size: 13px; }
.fmt table { border-collapse: collapse; margin: 6px 0 10px; font-size: 12.5px; }
.fmt th, .fmt td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; }
.fmt th { background: var(--surface-2); }
.fmt h5 { margin: 14px 0 4px; font-size: 13px; letter-spacing: .02em; color: var(--accent); }
.fmt ul { margin: 2px 0 8px; padding-left: 20px; } .fmt li { margin: 1px 0; }
.fmt p { margin: 4px 0 8px; }
.anexo { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); font-size: 13px; font-weight: 600; }
.senha { font-family: var(--mono); font-size: 12.5px; letter-spacing: .02em; }
.cofre-aviso { padding: 10px 14px; border-radius: 8px; background: var(--late-bg); color: var(--late); font-size: 13px; }
.modo { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.modo button { border: none; background: var(--surface); padding: 6px 12px; font-size: 12.5px; color: var(--muted); }
.modo button.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.blocos { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; padding: 14px; }
.bloco { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); display: flex; flex-direction: column; }
.bloco pre { margin: 0; padding: 12px 14px; white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.55 var(--font); flex: 1; }
.bloco pre b { font-weight: 700; }
.bloco .acoes { display: flex; gap: 6px; justify-content: flex-end; padding: 8px 10px; border-top: 1px solid var(--line-2); background: var(--surface-2); border-radius: 0 0 8px 8px; }
.bloco textarea { width: 100%; min-height: 160px; border: 0; padding: 12px 14px; font: 13px/1.55 var(--font); background: var(--surface); resize: vertical; }
/* Seleção e movimentação entre etapas */
.selbox { width: 17px; height: 17px; margin: 5px 2px 0 0; accent-color: var(--accent); flex: none; cursor: pointer; }
.grid-row.item.sel { background: color-mix(in srgb, var(--accent-soft) 70%, transparent); }
.grid-head .selhead { display: inline-flex; align-items: center; gap: 8px; }
.selbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; box-shadow: 0 8px 28px rgba(0,0,0,.25); width: max-content; max-width: calc(100vw - 32px); }
.selbar .btn { white-space: nowrap; }
.selbar b { font-size: 13.5px; padding: 0 6px; }
.selbar .linha { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; width: 100%; }
.selbar .linha + .linha { border-top: 1px solid color-mix(in srgb, var(--bg) 20%, transparent); padding-top: 8px; }
.selbar input[type=date] { padding: 5px 8px; border-radius: 6px; border: 1px solid color-mix(in srgb, var(--bg) 35%, transparent); background: var(--bg); color: var(--ink); font-size: 13px; }
.selbar .btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.selbar .btn { background: transparent; color: var(--bg); border-color: color-mix(in srgb, var(--bg) 35%, transparent); padding: 6px 10px; display: inline-flex; gap: 6px; align-items: center; }
.selbar .btn:hover { background: color-mix(in srgb, var(--bg) 15%, transparent); }
.selbar .btn:disabled { opacity: .35; }
.selbar .dot { width: 9px; height: 9px; border-radius: 3px; }
.group.drop { outline: 2px dashed var(--accent); outline-offset: 2px; }
.grid-row.item[draggable="true"] { cursor: grab; }
/* Checklist da preparação */
.ck { border-left: 3px solid var(--st-prep); background: var(--surface); border-radius: 0 8px 8px 0; margin-bottom: 10px; }
.ck-head { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid var(--line-2); }
.ck-head b { font-size: 14px; }
.ck-bar { display: inline-block; width: 90px; height: 7px; border-radius: 4px; background: var(--line-2); overflow: hidden; vertical-align: middle; margin-right: 6px; }
.ck-bar span { display: block; height: 100%; background: var(--st-prep); }
.ck-bar.ok span { background: var(--ok); }
.ck-item { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 12px; border-bottom: 1px solid var(--line-2); }
.ck-item input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--ok); margin: 0; }
.ck-item.feito { background: color-mix(in srgb, var(--ok-bg) 70%, transparent); }
.ck-item.feito .ck-nome { color: var(--ok); font-weight: 600; }
.ck-ok { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; background: var(--ok); color: #fff; font-size: 12px; font-weight: 700; white-space: nowrap; }
.ck-na { display: inline-flex; padding: 2px 9px; border-radius: 999px; background: var(--idle-bg); color: var(--muted); font-size: 12px; font-weight: 600; white-space: nowrap; }
.ck-item.na .ck-nome { color: var(--muted); font-style: italic; }
.ck-nome { font-size: 13.5px; font-weight: 500; overflow-wrap: anywhere; }
.ck-meta { font-size: 11.5px; color: var(--muted); }
.ck-acts { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
.ck-add { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 8px 12px; }
.ck-add input[type=text] { flex: 1 1 240px; padding: 6px 9px; border: 1px dashed var(--line); border-radius: 6px; background: var(--surface); font-size: 13px; }
.ck-foot { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; padding: 10px 12px; background: var(--surface-2); border-radius: 0 0 8px 0; font-size: 13px; }
.ck-cel { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 12.5px; white-space: nowrap; }
/* Caixa de entrada (Outlook, Teams, Slack) */
.cx-canais { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.cx-canal { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; border-top: 4px solid var(--cc); }
.cx-canal .row b { font-size: 14px; }
.cx-msg { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line-2); align-items: start; }
.cx-msg.tratada { opacity: .6; }
.pid-sync { display: flex; flex-direction: column; gap: 12px; }
.pid-passos ol { margin: 0 0 10px; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; }
.pid-fav { cursor: grab; margin: 0 2px; }
.pid-ciclo { border-bottom: 1px solid var(--line-2); }
.pid-ciclo:last-child { border-bottom: none; }
.pid-ciclo.removido { opacity: .6; }
.pid-cab { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; padding: 11px 14px; background: none; border: none; text-align: left; color: inherit; font: inherit; cursor: pointer; }
.pid-cab:hover { background: var(--surface-2); }
.pid-seta { color: var(--muted); }
.pid-nome { display: block; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pid-meta { display: block; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pid-cont { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
.pid-corpo { padding: 4px 14px 14px 42px; display: flex; flex-direction: column; gap: 10px; }
.pid-tab { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.pid-lin { display: grid; grid-template-columns: minmax(0, 2.4fr) minmax(0, 1fr) 120px 92px minmax(0, 2fr); gap: 10px; padding: 8px 12px; border-top: 1px solid var(--line-2); font-size: 13px; align-items: start; }
.pid-lin.pid-th { border-top: none; background: var(--surface-2); font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
.pid-lin.novo { background: color-mix(in srgb, var(--accent-soft) 55%, transparent); }
.pid-ant { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
.pid-obs small, .pid-msg small { color: var(--muted); }
.pid-obs { display: flex; flex-direction: column; gap: 2px; overflow-wrap: anywhere; }
.pid-bloco h3 { font-size: 13px; margin: 4px 0 6px; }
.pid-msg { padding: 8px 10px; border-left: 3px solid var(--line); background: var(--surface-2); border-radius: 0 6px 6px 0; font-size: 13px; margin-bottom: 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
.pid-msg.novo { border-left-color: var(--accent); }
@media (max-width: 900px) { .pid-lin { grid-template-columns: minmax(0, 1fr) 110px; } .pid-lin > :nth-child(2), .pid-lin > :nth-child(4) { display: none; } .pid-lin > :nth-child(5) { grid-column: 1 / -1; } .pid-th > :nth-child(5) { display: none; } .pid-corpo { padding-left: 14px; } .pid-cab { grid-template-columns: 18px minmax(0, 1fr); } .pid-cont { grid-column: 2; justify-content: flex-start; } }
.cx-msg.novo { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
.cx-ico { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 12px; background: var(--cc); }
.cx-top { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; font-size: 12.5px; color: var(--muted); }
.cx-top b { color: var(--ink); font-size: 13.5px; }
.cx-ass { font-weight: 600; margin-top: 2px; overflow-wrap: anywhere; }
.cx-txt { font-size: 13px; color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-line; }
.cx-txt.full { -webkit-line-clamp: unset; display: block; }
.cx-acts { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.cx-acts .row { justify-content: flex-end; }
.cx-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.cx-vinc { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px; background: var(--surface-2); border-radius: 8px; }
.cx-vinc select, .cx-vinc input { padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-size: 13px; min-width: 0; }
.cx-vinc select { flex: 1 1 260px; } .cx-vinc input { flex: 2 1 280px; }
.cx-err { font-size: 12.5px; color: var(--warn); }
.orig { font-size: 11.5px; color: var(--accent); white-space: nowrap; }
@media (max-width: 760px) { .cx-msg { grid-template-columns: 34px minmax(0, 1fr); } .cx-acts { grid-column: 1 / -1; align-items: stretch; } }
/* Fundo */
.stepper { list-style: none; margin: 0; padding: 12px 16px; display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 8px; }
.stepper li { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.stepper li i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); flex: none; }
.stepper li.done i { background: var(--accent); }
.stepper li.now { color: var(--ink); font-weight: 600; } .stepper li.now i { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.f-layout { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start; }
.f-main { flex: 999 1 600px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.f-side { flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line); }
.tab { padding: 9px 2px; border: none; border-bottom: 2px solid transparent; background: none; color: var(--muted); font-size: 14px; }
.tab.on { border-bottom-color: var(--accent); color: var(--ink); font-weight: 600; }
.doc-row { display: grid; grid-template-columns: minmax(220px, 2fr) 170px 190px 130px 92px; gap: 0; align-items: center; min-width: 820px; border-bottom: 1px solid var(--line-2); }
.doc-row > * { padding: 8px 10px; min-width: 0; }
.doc-row select, .doc-row input { width: 100%; padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-size: 12.5px; }
.doc-name { font-weight: 600; font-size: 13px; overflow-wrap: anywhere; }
.doc-meta { font-size: 11.5px; color: var(--muted); }
.cartas { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.carta { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.carta small { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.carta b { font-size: 14px; }
.carta select { padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-size: 12.5px; }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 12px; font-weight: 600; color: var(--muted); }
.field.wide { grid-column: 1 / -1; }
.field input, .field select, .field textarea { width: 100%; }
.f-side .form { grid-template-columns: minmax(0,1fr) minmax(0,1fr) !important; }
.hist li { display: grid; grid-template-columns: 30px minmax(0,1fr) auto; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line-2); font-size: 13px; }
.hist { list-style: none; margin: 0; padding: 0; }
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 8px; font-size: 13px; max-width: 420px; z-index: 50; }
.toast.err { background: var(--late); color: #fff; }
.notice { padding: 12px 16px; border-radius: 10px; background: var(--info-bg); color: var(--info); font-size: 13px; }

/* ---------- Barra lateral fixa, rodapé com sincronização ---------- */
body { transition: background-color .2s, color .2s; }
.nav { position: sticky; top: 0; height: 100vh; gap: 0; padding-bottom: 12px; }
.nav-in { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; margin: 0 -6px; padding: 0 6px 12px; scrollbar-width: thin; }
.nav-foot { flex: none; display: flex; flex-direction: column; gap: 6px; padding-top: 12px; border-top: 1px solid var(--line); }
.nl { transition: background-color .12s, color .12s; }
.nl .lab { display: inline-flex; align-items: center; gap: 10px; min-width: 0; }
.nl .lab .ic { flex: none; opacity: .8; }
.nl.on .lab .ic { opacity: 1; }
.ic { display: inline-block; vertical-align: middle; flex: none; }
.sync { border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); padding: 10px 11px; display: flex; flex-direction: column; gap: 8px; font-size: 12px; }
.sync-h { display: flex; align-items: center; gap: 7px; }
.sync-h b { font-size: 12.5px; flex: 1; min-width: 0; }
.sync-r { border: none; background: none; color: var(--muted); padding: 3px; border-radius: 5px; display: inline-grid; place-items: center; }
.sync-r:hover { color: var(--accent); background: var(--accent-soft); }
.sync-r.gira .ic { animation: gira .8s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); flex: none; position: relative; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.run { background: var(--accent); }
.dot.ok::after, .dot.run::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 2px solid currentColor; color: inherit; opacity: 0; }
.dot.ok.pulso::after { color: var(--ok); animation: pulso 1.2s ease-out 2; }
.dot.run::after { color: var(--accent); animation: pulso 1.2s ease-out infinite; }
@keyframes pulso { 0% { opacity: .7; transform: scale(.6); } 100% { opacity: 0; transform: scale(1.9); } }
.sync-num { display: flex; align-items: baseline; gap: 6px; }
.sync-num b { font: 600 20px/1 var(--mono); }
.sync-num span { color: var(--muted); }
.sbar { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--line-2); gap: 1px; }
.sbar span { height: 100%; transition: width .6s cubic-bezier(.2,.8,.2,1); min-width: 0; }
.sbar.imp span { background: var(--accent); border-radius: 99px; background-image: linear-gradient(45deg, rgba(255,255,255,.22) 25%, transparent 25%, transparent 50%, rgba(255,255,255,.22) 50%, rgba(255,255,255,.22) 75%, transparent 75%); background-size: 14px 14px; animation: listras 1s linear infinite; }
@keyframes listras { to { background-position: 14px 0; } }
.sync-leg { display: flex; flex-direction: column; gap: 3px; }
.sync-leg span { display: flex; align-items: center; gap: 5px; color: var(--muted); white-space: nowrap; overflow: hidden; }
.sync-leg i { width: 7px; height: 7px; border-radius: 2px; flex: none; }
.sync-leg b { margin-left: auto; font: 500 11.5px var(--mono); color: var(--ink); }
.sync-m { color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
.sync-m.err { color: var(--warn); }
.sync .btn.sm { align-self: flex-start; }
/* ---------- Topo ---------- */
.top { position: sticky; top: 0; z-index: 20; }
.search-w { position: relative; display: flex; align-items: center; }
.search-w .ic { position: absolute; left: 10px; color: var(--muted); pointer-events: none; }
.search-w .search { padding-left: 32px; padding-right: 30px; transition: border-color .12s, box-shadow .12s; }
.search-w .search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); outline: none; }
.search-w kbd { position: absolute; right: 8px; font: 500 11px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; background: var(--surface); pointer-events: none; }
.search-w .search:focus + kbd, .search-w .search:not(:placeholder-shown) + kbd { display: none; }
.icon-btn { width: 34px; height: 34px; display: inline-grid; place-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); transition: border-color .12s, background-color .12s; }
.icon-btn:hover { border-color: var(--accent); color: var(--accent); }
.umenu { position: relative; }
.me-btn { border: 1px solid transparent; background: none; border-radius: 999px; padding: 3px 10px 3px 3px; font-size: 13px; }
.me-btn:hover, .me-btn[aria-expanded="true"] { border-color: var(--line); background: var(--surface-2); }
.menu { position: absolute; right: 0; top: calc(100% + 6px); min-width: 240px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 14px 40px rgba(0,0,0,.14); padding: 6px; z-index: 40; display: flex; flex-direction: column; animation: surge .12s ease-out; }
@keyframes surge { from { opacity: 0; transform: translateY(-4px); } }
.menu .mh { padding: 8px 10px 10px; border-bottom: 1px solid var(--line-2); margin-bottom: 4px; display: flex; flex-direction: column; gap: 2px; }
.menu .mh span { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.menu button { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: none; background: none; border-radius: 6px; text-align: left; font-size: 13px; }
.menu button:hover { background: var(--accent-soft); }
.menu hr { border: none; border-top: 1px solid var(--line-2); margin: 4px 0; width: 100%; }
/* ---------- Componentes gerais ---------- */
.card { box-shadow: 0 1px 2px rgba(15,25,22,.04); }
.btn { transition: border-color .12s, background-color .12s, color .12s; display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn.danger { color: var(--late); border-color: color-mix(in srgb, var(--late) 40%, var(--line)); }
.btn.danger:hover { background: var(--late); color: #fff; border-color: var(--late); }
.btn.dangerf { background: var(--late); border-color: var(--late); color: #fff; font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; padding: 3px; background: var(--surface-2); gap: 2px; flex-wrap: wrap; }
.seg button { border: none; background: none; padding: 6px 14px; border-radius: 6px; font-size: 13px; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.in { padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); font-size: 13.5px; width: 100%; min-width: 0; }
.in:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); outline: none; }
.lbl { display: flex; flex-direction: column; gap: 5px; font-size: 12px; font-weight: 600; color: var(--muted); }
.lbl small { font-weight: 400; }
.hint { font-size: 12px; color: var(--muted); }
/* ---------- Configurações ---------- */
.cfg { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 22px; align-items: start; }
.cfg-nav { display: flex; flex-direction: column; gap: 2px; position: sticky; top: 80px; }
.cfg-nav button { display: flex; gap: 10px; align-items: flex-start; padding: 9px 11px; border: none; background: none; border-radius: 8px; text-align: left; color: var(--ink); }
.cfg-nav button .ic { margin-top: 2px; color: var(--muted); }
.cfg-nav button span { display: flex; flex-direction: column; font-size: 13.5px; font-weight: 500; }
.cfg-nav button small { font-size: 11.5px; color: var(--muted); font-weight: 400; }
.cfg-nav button:hover { background: var(--surface); }
.cfg-nav button.on { background: var(--surface); box-shadow: inset 3px 0 0 var(--accent), 0 1px 2px rgba(0,0,0,.05); }
.cfg-nav button.on .ic { color: var(--accent); }
.cfg-body { display: flex; flex-direction: column; gap: 16px; max-width: 820px; min-width: 0; }

    <span><b class="mono" style="color:var(--ink)">${base.filter(aberto).reduce((n, f) => n + docsAbertos(f).length, 0)}</b> subitens pendentes</span></div></section>

  <div class="row between"><div class="filters">
    ${outros ? opts("adm", "ADM", uniq((f) => f.adm), F.adm) : ""}
    ${ev ? opts("tipoEv", "Tipo de evento", uniq((f) => f.tipoEvento), F.tipoEv) : ""}
    ${opts("tipo", "Tipo de fundo", uniq((f) => f.tipo), F.tipo)}
    ${opts("auditor", "Auditor", uniq((f) => f.auditor), F.auditor)}
    ${ev ? "" : opts("ano", "Ano-base", uniq((f) => f.ano), F.ano)}
    <select data-filter="resp" aria-label="Responsável"><option value="">Responsável: todos</option><option value="none"${F.resp === "none" ? " selected" : ""}>Subitens sem responsável</option>${equipeIds().map((id) => `<option value="${esc(id)}"${F.resp === id ? " selected" : ""}>${esc(pname(id))}</option>`).join("")}</select>
    ${ev ? "" : `<select data-filter="prazo" aria-label="Prazo"><option value="">Prazo: todos</option><option value="late"${F.prazo === "late" ? " selected" : ""}>Atrasados</option><option value="soon"${F.prazo === "soon" ? " selected" : ""}>Vencem em até 7 dias</option><option value="ok"${F.prazo === "ok" ? " selected" : ""}>No prazo</option><option value="none"${F.prazo === "none" ? " selected" : ""}>Sem data</option></select>`}
    ${Object.values(F).some(Boolean) ? `<button class="btn ghost" data-act="clear-filters">Limpar filtros</button>` : ""}
  </div>${S.canWrite ? `<button class="btn pri" data-act="new-fund">+ Novo fundo</button>` : ""}</div>
  <div id="newFund"></div>`;
  for (const e of ETAPAS) {
    const prep = e.k === "prep", cols = boardCols(ev, outros, prep), tmpl = cols.map((c) => c.w).join(" ");
    const rows = fl.filter((f) => f.etapa === e.k).sort(ev ? (a, b) => (a.dataEvento || "9999").localeCompare(b.dataEvento || "9999") : (a, b) => (a.entrega || "9999").localeCompare(b.entrega || "9999"));
    const open = !S.closed.has(e.k);
    const lateN = ev ? rows.filter((f) => (idadeEv(f)?.m ?? -1) >= 12).length : rows.filter((f) => prazoInfo(f).k === "late").length;
    const tag = e.k === "inbox" && rows.length ? `<span class="chip warn">Classificar</span>` : e.k === "done" ? "" : lateN ? `<span class="chip late">${lateN} ${ev ? "com evento +12 meses" : "atrasados"}</span>` : "";
    h += `<section class="card group" data-drop="${e.k}"><button class="g-head" data-act="toggle-group" data-k="${e.k}" aria-expanded="${open}"><span class="t"><span class="g-dot" style="background:${e.c}"></span><b>${e.n}</b><span class="mono" style="font-size:12px;color:var(--muted)">${rows.length}</span><span style="font-size:12.5px;color:var(--muted)">${e.sub}</span></span><span class="row">${tag}<span style="font-size:12px;color:var(--muted)">${open ? "Recolher" : "Expandir"}</span></span></button>`;
    if (open) {
      const todosSel = rows.length && rows.every((f) => S.sel.has(f.id));
      h += `<div class="tbl"><div class="grid-row grid-head" style="grid-template-columns:${tmpl}">${cols.map((c, i) => i === 0 && S.canWrite && rows.length ? `<span class="selhead"><input type="checkbox" class="selbox" data-act="sel-grupo" data-k="${e.k}" aria-label="Selecionar todos de ${esc(e.n)}"${todosSel ? " checked" : ""}>${c.h}</span>` : `<span>${c.h}</span>`).join("")}</div>`;
      if (!rows.length) h += `<div class="empty">Nenhum fundo nesta etapa.</div>`;
      for (const f of rows) {
        const da = docsAbertos(f), p = prazoInfo(f), idd = idadeEv(f);
        const resps = [...new Set(da.map((d) => d.resp).filter(Boolean))].slice(0, 3);
        const subOn = S.openSub.has(f.id);
        const sel = S.sel.has(f.id);
        h += `<div class="grid-row item${sel ? " sel" : ""}" style="grid-template-columns:${tmpl}" data-fund="${esc(f.id)}" tabindex="0"${S.canWrite ? ' draggable="true"' : ""}>
          <span class="f-cell">${S.canWrite ? `<input type="checkbox" class="selbox" data-act="sel-fund" data-id="${esc(f.id)}" aria-label="Selecionar ${esc(f.nome)}"${sel ? " checked" : ""}>` : ""}<button class="chev${subOn ? " on" : ""}" data-act="toggle-sub" data-id="${esc(f.id)}" aria-expanded="${subOn}" aria-label="${subOn ? "Recolher" : "Abrir"} ${prep ? "checklist" : "subitens"} de ${esc(f.nome)}">▶</button><span><div class="f-name">${esc(f.nome)}</div><div class="f-sub">${esc(f.cnpj || "sem CNPJ")}</div></span></span>
          ${outros ? `<span>${esc(f.adm || "—")}</span>` : ""}
          ${ev ? `<span><span class="chip ev" style="--c:${EV_COR(f.tipoEvento)}">${esc(f.tipoEvento || "Classificar")}</span></span><span class="mono" style="font-size:12.5px">${br(f.dataEvento)} ${idd ? `<span class="chip ${idd.c}">${idd.txt}</span>` : ""}</span><span>${pillTipo(f.tipo)}</span>`
            : `<span>${pillTipo(f.tipo)}</span><span>${pillMes(f)}</span>`}
          <span>${pillAud(f.auditor)}</span>
          ${prep ? ckCelula(f) : ""}
          ${prep ? "" : `<span class="row" style="gap:6px;flex-wrap:nowrap"><span class="subn" title="${da.length} em aberto de ${(f.docs || []).length}">${da.length} <span style="color:var(--muted)">abertos</span></span><span class="avs">${resps.map((r) => avatar(r)).join("")}${da.some((d) => !d.resp) ? avatar(null) : ""}</span></span>`}

        </div>`;
        if (subOn) h += `<div class="subwrap">${prep ? ckPainel(f) : subPainel(f)}</div>`;
      }
      h += `</div>`;
    }
    h += `</section>`;
  }
  // barra de ações da seleção
  const selVis = [...S.sel].filter((id) => S.fundos.has(id));
  if (selVis.length && S.canWrite) {
    const etapasSel = new Set(selVis.map((id) => S.fundos.get(id).etapa));
    const datas = new Set(selVis.map((id) => S.fundos.get(id).entrega || ""));
    h += `<div class="selbar" role="toolbar" aria-label="Ações nos fundos selecionados"><div class="linha"><b>${selVis.length} selecionado${selVis.length > 1 ? "s" : ""}</b><span style="font-size:12.5px;opacity:.75">Mover para:</span>
      ${ETAPAS.map((x) => `<button class="btn sm" data-act="mover" data-k="${x.k}"${etapasSel.size === 1 && etapasSel.has(x.k) ? " disabled" : ""}><span class="dot" style="background:${x.c}"></span>${x.n}</button>`).join("")}
      <button class="btn sm" data-act="sel-limpar" title="Limpar seleção">✕</button></div>
      ${ev ? "" : `<div class="linha"><label for="selEntrega" style="font-size:12.5px;opacity:.85">Data de entrega:</label><input type="date" id="selEntrega" data-k="sel.entrega" value="${esc(S.selEntrega)}">
        <button class="btn sm pri" data-act="sel-entrega"${S.selEntrega ? "" : " disabled"}>Aplicar aos ${selVis.length}</button><button class="btn sm" data-act="sel-entrega-limpar">Remover data</button>
        <span style="font-size:12px;opacity:.7">${datas.size === 1 ? ([...datas][0] ? "Atual: " + br([...datas][0]) : "Hoje sem data") : "Datas diferentes hoje"}</span></div>`}</div>`;
  }
  $("view").innerHTML = h;
  $("view").style.setProperty("--minw", ev ? "1000px" : "940px");
  resolveProfiles(fl.flatMap((f) => (f.docs || []).map((d) => d.resp)));
}

function datalists() {

    <datalist id="dlDoc">${u((f) => f.docInicial).map((a) => `<option value="${esc(a)}">`).join("")}</datalist>`;
}

  $("view").innerHTML = h;
  resolveProfiles((f.docs || []).map((d) => d.resp).concat(equipeIds()));
}

    ${r.completo && S.canWrite ? `<button class="btn sm pri" data-act="advance" data-id="${esc(f.id)}" title="Enviar para Em andamento">Enviar ▸</button>` : ""}</span>`;
}
function ckPainel(f) {
  const ro = !S.canWrite ? " disabled" : "", ck = f.check || {}, r = ckResumo(f), nPrep = lista().filter((x) => x.etapa === "prep").length;

    const st = ck[i.id]?.s || "", meta = st ? `${st === "feito" ? "Feito" : "Não se aplica"}${ck[i.id].por ? " · " + esc(pname(ck[i.id].por)) : ""}${ck[i.id].em ? " · " + br(ck[i.id].em) : ""}` : i.modelo ? (i.se ? `Item padrão para fundos ${esc(i.se)}` : "Item padrão da preparação") : "Item só deste fundo";
    return `<div class="ck-item${st === "feito" ? " feito" : st === "na" ? " na" : ""}" data-fid="${esc(f.id)}" data-ck="${esc(i.id)}">

function cxParseSlack(md, o) {

const corTexto = (hex) => { const m = /^#?([0-9a-f]{6})$/i.exec(hex || ""); if (!m) return "var(--ink)"; const n = parseInt(m[1], 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255; return (0.299 * r + 0.587 * g + 0.114 * b) > 160 ? "#1a1a1a" : "#fff"; };

// Texto simples → HTML: títulos em maiúsculas, listas com "- ", tabelas com " | ", links.
function fmtTexto(t) {
  return String(t || "").split(/\n\s*\n/).map((bl) => {
    const ls = bl.split("\n").map((l) => l.trimEnd()).filter((l) => l.trim());
    if (!ls.length) return "";
    const tab = ls.slice(ls.length > 1 && !ls[0].includes(" | ") ? 1 : 0);
    if (tab.length >= 2 && tab.every((l) => l.includes(" | "))) {
      const cab = ls.length > tab.length ? `<h5>${esc(ls[0])}</h5>` : "";
      const rows = tab.map((l) => l.split(" | ").map((c) => c.trim()));
      return `${cab}<table><thead><tr>${rows[0].map((c) => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${rows.slice(1).map((r) => `<tr>${r.map((c) => `<td>${linkify(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
    }
    let h = "", lista = [];
    const fecha = () => { if (lista.length) { h += `<ul>${lista.map((x) => `<li>${linkify(x)}</li>`).join("")}</ul>`; lista = []; } };
    for (const l of ls) {
      if (/^\s*-\s+/.test(l)) { lista.push(l.replace(/^\s*-\s+/, "")); continue; }
      fecha();
      const titulo = l.length < 90 && /[A-ZÀ-Ú]{3}/.test(l) && l === l.toUpperCase();
      h += titulo ? `<h5>${esc(l)}</h5>` : `<p>${linkify(l)}</p>`;
    }
    fecha(); return h;
  }).join("");
}

const queues = new Map();
function serial(key, fn) { const p = (queues.get(key) || Promise.resolve()).then(fn, fn); queues.set(key, p.catch(() => {})); return p; }
function writeErr(e) {
  if (e && e.code === "invalid_argument") { S.canWrite = false; toast("Você não tem permissão para alterar os dados desta ferramenta. Peça ao responsável o papel de contribuidor.", true); render(); }
  else if (e && e.code === "quota_exceeded") toast("O banco de dados atingiu o limite. Avise o responsável pela ferramenta.", true);
  else toast("Não foi possível salvar. Tente de novo em alguns segundos.", true);
}
async function saveFund(id, patch, acao, texto) {
  try {
    await serial("f:" + id, () => S.db.doc("fundos/" + id).update(patch));
    toast("Salvo");
    if (acao) logHist(id, acao, texto);
  } catch (e) { writeErr(e); }
}
async function logHist(id, a, t) {
  const entry = { q: new Date().toISOString(), u: S.me?.id || null, a, t: t || "" };
  try {
    await serial("h:" + id, async () => {
      const ref = S.db.doc("historico/" + id); const snap = await ref.get();
      const es = snap.exists ? (snap.data().entries || []) : [];
      await ref.set({ entries: [entry, ...es].slice(0, 300) });
    });
  } catch (e) { /* histórico é complementar */ }
}
function subscribeHist(id) {
  S.hist = null;

function patchSub(f, docId, patch, acao, lbl) {
  const docs = (f.docs || []).map((d) => (d.id === docId ? { ...d, ...patch, atualizadoEm: hojeISO() } : d));
  return saveFund(f.id, { docs }, acao, lbl);
}
function updateDoc(f, docId, field, value) {
  const d = (f.docs || []).find((x) => x.id === docId); if (!d) return;
  const lbl = field === "s" ? `Status de “${d.nome}” → ${DOC_NOME[value]?.n}` : field === "resp" ? `Responsável de “${d.nome}” → ${pname(value || null)}` : field === "via" ? `Via de “${d.nome}” → ${value || "—"}` : field === "area" ? `Área de “${d.nome}” → ${value || "—"}` : `Comentário em “${d.nome}”`;
  patchSub(f, docId, { [field]: value || null }, field === "obs" ? "Comentou" : "Atualizou subitem", lbl);
}
function concluirSub(f, docId) {
  const d = (f.docs || []).find((x) => x.id === docId); if (!d) return;
  patchSub(f, docId, { concluido: true, concluidoEm: hojeISO(), concluidoPor: S.me?.id || null }, "Concluiu subitem", d.nome);
}
function reabrirSub(f, docId) {
  const d = (f.docs || []).find((x) => x.id === docId); if (!d) return;
  patchSub(f, docId, { concluido: false, concluidoEm: null, concluidoPor: null, s: DOC_ABERTO(d.s) ? d.s : "afazer" }, "Reabriu subitem", d.nome);
}

async function moverFundos(ids, destino) {
  ids = ids.filter((id) => S.fundos.has(id) && S.fundos.get(id).etapa !== destino);
  if (!ids.length) return;
  const ordem = (k) => ETAPAS.findIndex((x) => x.k === k);
  const pend = ids.filter((id) => { const f = S.fundos.get(id); return f.etapa === "prep" && ordem(destino) > ordem("prep") && !ckResumo(f).completo; });
  if (pend.length && !confirm(`${pend.length} fundo(s) ainda estão com o checklist de preparação incompleto:\n\n${pend.slice(0, 8).map((id) => "• " + S.fundos.get(id).nome).join("\n")}${pend.length > 8 ? "\n…" : ""}\n\nMover mesmo assim para ${ETAPA_NOME[destino]}?`)) return;
  let ok = 0, falhou = 0;
  toast(`Movendo ${ids.length} fundo(s)…`);
  for (const id of ids) {
    const f = S.fundos.get(id), de = f.etapa;
    try { await serial("f:" + id, () => S.db.doc("fundos/" + id).update({ etapa: destino, etapaEm: hojeISO() })); ok++; logHist(id, "Moveu etapa", `${ETAPA_NOME[de]} → ${ETAPA_NOME[destino]}`); }
    catch (e) { falhou++; if (e && e.code === "invalid_argument") { writeErr(e); break; } }
  }
  S.sel.clear(); render();
  toast(falhou ? `${ok} movido(s) para ${ETAPA_NOME[destino]}; ${falhou} não puderam ser salvos.` : `${ok} fundo(s) movido(s) para ${ETAPA_NOME[destino]}`, !!falhou);
}

async function definirEntrega(ids, data) {
  ids = ids.filter((id) => S.fundos.has(id) && (S.fundos.get(id).entrega || "") !== (data || ""));
  if (!ids.length) { toast("Os fundos selecionados já estão com essa data."); return; }
  if (!data && !confirm(`Remover a data de entrega de ${ids.length} fundo(s)?`)) return;
  let ok = 0, falhou = 0;
  toast(`Atualizando ${ids.length} fundo(s)…`);
  for (const id of ids) {
    const ant = S.fundos.get(id).entrega;
    try { await serial("f:" + id, () => S.db.doc("fundos/" + id).update({ entrega: data || null })); ok++; logHist(id, "Editou dados", `Entrega: ${ant ? br(ant) : "sem data"} → ${data ? br(data) : "sem data"}`); }
    catch (e) { falhou++; if (e && e.code === "invalid_argument") { writeErr(e); break; } }
  }
  S.selEntrega = ""; S.sel.clear(); render();
  toast(falhou ? `${ok} atualizado(s); ${falhou} não puderam ser salvos.` : data ? `Entrega de ${ok} fundo(s) definida para ${br(data)}` : `Data de entrega removida de ${ok} fundo(s)`, !!falhou);
}

async function importar() {
  if (!S.carga || S.importando) return;
  const fila = S.carga.filter((f) => !S.fundos.has(f.id));
  S.importando = { feito: S.carga.length - fila.length, total: S.carga.length, erro: "" }; render();
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  for (const f of fila) {
    let tent = 0;
    for (;;) {
      try { await S.db.doc("fundos/" + f.id).set(f); break; }
      catch (e) {
        tent++;
        if (e && (e.code === "resource_exhausted" || e.code === "unavailable") && tent < 8) { S.importando.erro = "aguardando o limite de gravação"; render(); await sleep(1500 * tent); continue; }
        S.importando.erro = "parou com erro: " + (e && e.code || "desconhecido") + ". Recarregue a página e clique em importar de novo para continuar."; render(); return;
      }
    }
    S.importando.feito++; S.importando.erro = "";
    if (S.importando.feito % 5 === 0) render();
    await sleep(120);
  }
  S.importando = null; S.carga = null; toast("Importação concluída"); render();
}

async function iniciaImport(lista) {
  const arqs = [...(lista || [])].filter((a) => /\.json$/i.test(a.name));
  if (!window.pbc) return toast("A importação por arquivo só existe na versão hospedada na Vercel.", true);
  if (!arqs.length) return toast("Escolha os arquivos .json (docs.json e cofre.json).", true);
  if (S.fundos.size && !confirm(`A base já tem ${S.fundos.size} fundos.\n\nImportar de novo substitui esses registros pelo conteúdo do arquivo e desfaz o que foi alterado na ferramenta desde a exportação.\n\nContinuar?`)) return;
  try { const n = await window.pbc.importar(arqs); toast(`${n} registros importados`); }
  catch (e) { toast("Falha na importação: " + (e.message || e), true); }
}
document.addEventListener("change", (e) => { if (e.target.id === "impArq") { const f = e.target.files; iniciaImport(f); e.target.value = ""; } });
document.addEventListener("keydown", (e) => { if (e.target.id === "impDrop" && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); $("impArq").click(); } });
document.addEventListener("dragover", (e) => { const d = e.target.closest?.("#impDrop"); if (!d || !e.dataTransfer?.types?.includes("Files")) return; e.preventDefault(); d.classList.add("sobre"); });
document.addEventListener("dragleave", (e) => { const d = e.target.closest?.("#impDrop"); if (d && !d.contains(e.relatedTarget)) d.classList.remove("sobre"); });
document.addEventListener("drop", (e) => { const d = e.target.closest?.("#impDrop"); if (!d) return; e.preventDefault(); d.classList.remove("sobre"); iniciaImport(e.dataTransfer.files); });

function geraSenha() {
  const c = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789", a = new Uint32Array(12);
  crypto.getRandomValues(a);
  return [...a].map((x) => c[x % c.length]).join("").replace(/(.{4})(.{4})(.{4})/, "$1-$2-$3");
}

    catch (e) { toast(e.message, true); t.disabled = false; }
  },
  "monday-sync": () => { if (SYNC.imp && !SYNC.imp.fim) return; iniciaMonday(); },
  "diag": async (t) => {
    t.disabled = true; const out = $("diagOut"); if (out) out.innerHTML = `<span class="hint">Consultando o servidor…</span>`;
    try {
      const d = await window.pbc.diagnostico(), c = d.colecoes, tela = S.fundos.size;
      const linha = (n, v, ok, obs) => `<tr><td>${n}</td><td class="mono" style="text-align:right">${v}</td><td>${ok ? `<span class="chip ok">ok</span>` : `<span class="chip warn">atenção</span>`}</td><td class="hint">${obs || ""}</td></tr>`;
      S.diag = `<table style="width:100%;border-collapse:collapse;font-size:13px">${[
        linha("Conexão com o Redis", d.ms + " ms", true, `região ${esc(d.servidor.regiao || "?")}${d.servidor.commit ? " · versão " + esc(d.servidor.commit) : ""}`),
        linha("Fundos gravados no servidor", c.fundos, c.fundos > 0, c.fundos ? (tela === c.fundos ? "todos aparecem na sua tela" : `sua tela mostra ${tela}: clique em Atualizar agora`) : "base vazia: importe o docs.json"),
        linha("Controles internos", c.controles, c.controles > 0, c.controles ? "" : "vêm no docs.json"),
        linha("Senhas e logins", c.cofre, c.cofre > 0, c.cofre ? "" : "vêm no cofre.json"),
        linha("Pessoas na Equipe", c.pessoas, true, ""),
        linha("Usuários com acesso", d.membros, d.membros > 0, ""),
        linha("Seu acesso", esc(d.voce.papel), d.voce.papel === "dono", d.voce.papel === "dono" ? "" : "só o dono importa dados"),
      ].join("").replace(/<td/g, '<td style="padding:7px 6px;border-bottom:1px solid var(--line-2)"')}</table>`;
    } catch (e) { S.diag = `<div class="notice" style="background:var(--late-bg);color:var(--late)">Falha ao consultar o servidor: ${esc(e.message || e)}</div>`; }
    const o2 = $("diagOut"); if (o2) o2.innerHTML = S.diag; t.disabled = false;
  },
  "ms-conectar": async () => { try { await window.pbc.microsoft.conectar(); toast("Conta Microsoft conectada"); } catch (e) { toast(e.message || "Não foi possível conectar.", true); } },
  "ms-desconectar": async () => { await window.pbc.microsoft.desconectar(); toast("Conta Microsoft desconectada"); },
};
document.addEventListener("submit", async (e) => {
  const id = e.target.id;
  if (id === "cfgNovo") {
    e.preventDefault();
    const nome = $("cfgNn").value.trim(), email = $("cfgNe").value.trim().toLowerCase(), senha = $("cfgNs").value.trim();
    const papel = e.target.querySelector('input[name="cfgNp"]:checked')?.value || "contribuidor", equipe = $("cfgNeq").checked;
    if (window.pbc.membros().some((m) => m.email === email)) return toast("Esse e-mail já tem acesso. Use “Redefinir senha” na lista.", true);
    const bt = e.target.querySelector('button[type="submit"]'); bt.disabled = true; bt.textContent = "Adicionando…";
    try {
      await window.pbc.salvarMembro({ nome, email, papel, senha });
      if (equipe && S.canWrite) await S.db.doc("pessoas/" + email).set({ adicionadoEm: new Date().toISOString() }).catch(() => {});
      S.cfgAdd = false; S.cfgNovaSenha = ""; S.cfgConvite = { nome, email, senha, novo: true }; render(); toast("Usuário adicionado");
    } catch (er) { toast(er.message, true); bt.disabled = false; bt.textContent = "Adicionar usuário"; }
  }
  if (id === "cfgSenha") {
    e.preventDefault();
    const a = $("cfgSa").value, n = $("cfgSn").value;
    if (n !== $("cfgSn2").value) return toast("As senhas novas não conferem.", true);
    if (n.length < 8) return toast("A nova senha precisa ter pelo menos 8 caracteres.", true);
    try { await window.pbc.trocarSenha(a, n); e.target.reset(); $("cfgForca").style.width = "0"; $("cfgForcaT").textContent = ""; toast("Senha alterada"); }
    catch (er) { toast(er.message, true); }
  }
});
document.addEventListener("input", (e) => {
  const id = e.target.id;
  if (id === "cfgMq") { S.cfgMq = e.target.value; render(); }
  if (id === "cfgSn" || id === "cfgSn2") {
    const n = $("cfgSn").value, f = forcaSenha(n);
    $("cfgForca").style.cssText = `width:${f.w}%;background:${f.c}`; $("cfgForcaT").textContent = n ? f.t : "";
    const r = $("cfgSn2").value; $("cfgIgual").textContent = r ? (r === n ? "✓ Conferem" : "Ainda não conferem") : "";
    $("cfgIgual").style.color = r === n ? "var(--ok)" : "var(--muted)";
  }
});
document.addEventListener("change", async (e) => {
  if (e.target.id === "cfgVer") { for (const i of document.querySelectorAll("#cfgSenha input[autocomplete$='password']")) i.type = e.target.checked ? "text" : "password"; }
  const email = e.target.dataset?.papel; if (!email || !window.pbc) return;
  try { await window.pbc.salvarMembro({ email, papel: e.target.value }); toast("Papel atualizado"); }
  catch (er) { toast(er.message, true); render(); }
});

// ---------------- Início ----------------
(async function start() {
  render();
  const claude = window.claude;
  if (!claude || !claude.use) { S.started = true; S.db = null; render(); return; }
  const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
  S.db = db; S.user = user; S.started = true;
  if (!db) { render(); return; }
  if (user) {
    S.me = await user.me();
    const w = await user.can("data.write"); if (w === false) S.canWrite = false;
    S.isOwner = await user.isOwner();
    if (S.me?.id) S.profiles[S.me.id] = S.me;
    $("me").innerHTML = S.me?.id ? `${avatar(S.me.id, 28)}<span class="nm" style="font-size:13px;font-weight:500">${esc(S.me.name || "Você")}</span><span style="color:var(--muted);display:inline-flex">${ic("down", 14)}</span>` : "";
    $("me").hidden = !S.me?.id;
  }
  const timer = setTimeout(() => { S.timedOut = true; render(); }, 10000);
  db.collection("fundos").onSnapshot((snap) => {
    const m = new Map(); for (const d of snap.docs) { const x = { ...d.data(), id: d.id }; x.aba = admDe(x); m.set(d.id, x); } ABAS_CACHE = null; S.cxFundosCache = new Map();
    S.fundos = m;
    if (!snap.metadata.fromCache) { S.loaded = true; clearTimeout(timer); } else if (m.size) S.loaded = true;
    if (S.loaded && !m.size && S.isOwner && S.carga === null) {
      S.carga = [];
      fetch("carga.json").then((r) => (r.ok ? r.json() : [])).then((d) => { S.carga = Array.isArray(d) ? d : []; render(); }).catch(() => {});
    }
    render();
  }, (err) => { clearTimeout(timer); S.loaded = true; toast("Os dados pararam de responder. Recarregue a página.", true); render(); });
  db.doc("cofre/acessos").onSnapshot((s) => { S.cofre = s.exists ? s.data() : { itens: [] }; if (S.view.name === "controles") render(); }, () => { S.cofre = "negado"; if (S.view.name === "controles") render(); });
  db.collection("controles").onSnapshot((snap) => { S.ctl = new Map(snap.docs.map((d) => [d.id, d.data()])); if (S.view.name === "controles") render(); }, () => {});
  db.doc("config/checklist").onSnapshot((s) => { S.ckModelo = s.exists ? s.data() : null; render(); }, () => {});
  db.collection("caixaStatus").onSnapshot((snap) => { S.cxSt = new Map(snap.docs.map((d) => [d.id, d.data()])); if (S.view.name === "caixa") render(); else renderNav(); }, () => {});
  db.doc("config/monday").onSnapshot((s) => { S.mondayInfo = s.exists ? s.data() : null; renderSync(); if (S.view.name === "config") render(); }, () => {});
  db.doc("config/caixa").onSnapshot((s) => { S.cxSync = s.exists ? s.data() : null; if (S.view.name === "caixa") render(); }, () => {});
  cxAssinar();
  pidAssinar();
  db.collection("pessoas").onSnapshot((snap) => { S.pessoas = snap.docs.map((d) => ({ id: d.id, ...d.data() })); render(); }, () => {});
})();
</script>
